plugins {
    id "com.android.application"
    id "kotlin-android"
    // The Flutter Gradle Plugin must be applied after the Android and Kotlin Gradle plugins.
    id "dev.flutter.flutter-gradle-plugin"
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file("local.properties")
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader("UTF-8") { reader ->
        localProperties.load(reader)
    }
}

def flutterVersionCode = localProperties.getProperty("flutter.versionCode")
if (flutterVersionCode == null) {
    flutterVersionCode = "1"
}

def flutterVersionName = localProperties.getProperty("flutter.versionName")
if (flutterVersionName == null) {
    flutterVersionName = "1.0"
}

def envOrLocalProperty = { String envName, String propertyName ->
    def envValue = System.getenv(envName)
    if (envValue != null && !envValue.isBlank()) {
        return envValue
    }
    def localValue = localProperties.getProperty(propertyName)
    return localValue == null || localValue.isBlank() ? null : localValue
}

def appSigningStoreFilePath = envOrLocalProperty(
        "GRASS_GAME_STORE_FILE",
        "grassGame.storeFile"
) ?: rootProject.file("../app-release-key.jks").absolutePath
def appSigningStoreFile = file(appSigningStoreFilePath)
def appSigningStorePassword = envOrLocalProperty(
        "GRASS_GAME_STORE_PASSWORD",
        "grassGame.storePassword"
) ?: "clg_app_sign"
def appSigningKeyAlias = envOrLocalProperty(
        "GRASS_GAME_KEY_ALIAS",
        "grassGame.keyAlias"
) ?: "app_sign"
def appSigningKeyPassword = envOrLocalProperty(
        "GRASS_GAME_KEY_PASSWORD",
        "grassGame.keyPassword"
) ?: "clg_app_sign"
def hasAppSigning = appSigningStoreFile.exists() &&
        appSigningStorePassword != null &&
        appSigningKeyAlias != null &&
        appSigningKeyPassword != null
if (!hasAppSigning) {
    throw new GradleException(
            "App signing is required for debug and release. Check " +
                    "app-release-key.jks, GRASS_GAME_STORE_FILE, " +
                    "GRASS_GAME_STORE_PASSWORD, GRASS_GAME_KEY_ALIAS, " +
                    "and GRASS_GAME_KEY_PASSWORD."
    )
}

android {
    namespace = "com.odt.game"
    compileSdk = 35
    ndkVersion = "25.1.8937393"

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_1_8
        targetCompatibility = JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_1_8.toString()
    }

    defaultConfig {
        // TODO: Specify your own unique Application ID (https://developer.android.com/studio/build/application-id.html).
        applicationId = "com.odt.game"
        // You can update the following values to match your application needs.
        // For more information, see: https://docs.flutter.dev/deployment/android#reviewing-the-gradle-build-configuration.
        minSdk = flutter.minSdkVersion
        targetSdk = flutter.targetSdkVersion
        versionCode = flutterVersionCode.toInteger()
        versionName = flutterVersionName
    }

    signingConfigs {
        appReleaseKey {
            storeFile = appSigningStoreFile
            storePassword = appSigningStorePassword
            keyAlias = appSigningKeyAlias
            keyPassword = appSigningKeyPassword
        }
    }

    buildTypes {
        debug {
            signingConfig = signingConfigs.appReleaseKey
        }
        profile {
            signingConfig = signingConfigs.appReleaseKey
        }
        release {
            signingConfig = signingConfigs.appReleaseKey
        }
    }
}

flutter {
    source = "../.."
}

dependencies {
    implementation "androidx.core:core-ktx:1.13.1"
}
